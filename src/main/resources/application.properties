spring.application.name=evidence-rag-java
spring.threads.virtual.enabled=true
spring.main.banner-mode=off
server.address=${RAG_BIND_ADDRESS:127.0.0.1}
server.port=${RAG_PORT:18084}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.factory.constraints.read.max-document-length=262144
spring.jackson.factory.constraints.read.max-token-count=20000
spring.jackson.factory.constraints.read.max-nesting-depth=20
spring.jackson.factory.constraints.read.max-string-length=262144
spring.jackson.factory.constraints.read.max-name-length=200
