[project]
name = "knowledge-native-agent"
version = "0.2.0"
description = "Native tool-loop Agent for the Java knowledge library"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pydantic==2.11.9",
  "fastapi==0.112.4",
  "httpx==0.28.1",
  "uvicorn==0.34.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "packaging==25.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
