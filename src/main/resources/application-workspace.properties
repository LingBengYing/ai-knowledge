# Explicit local workspace profile for the independent ai-knowledge-web frontend.
# Credentials and vector settings remain external; missing models stay unavailable.
server.address=127.0.0.1
rag.environment=development
rag.auth-mode=development_headers
rag.ingestion.enabled=true
rag.indexing.enabled=true
rag.answers.enabled=true
rag.model-configuration.enabled=true
rag.model-configuration.administrators=${RAG_MODEL_CONFIGURATION_ADMINISTRATORS:owner}
