name: Verify Java workbench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify secret scanner and frontend behavior
        run: node --test ui-tests/*.test.mjs scripts/check-secrets.test.mjs
      - name: Check files and reachable Git history for credentials
        run: node scripts/check-secrets.mjs --history
      - name: Build, test, format and enforce 80% line and branch coverage
        run: mvn -B -ntp -s .mvn/settings.xml -gs .mvn/settings.xml clean verify
      - name: Check whitespace and launcher syntax
        run: |
          git diff --check
          bash -n run-dev.sh
