[project]
name = "knowledge-dbgpt-agent"
version = "0.1.0"
description = "DB-GPT Agent adapter for the existing Java knowledge library"
requires-python = ">=3.10,<3.11"
dependencies = [
  "dbgpt[agent]==0.8.2",
  "dbgpt-ext==0.8.2",
  "mcp==1.16.0",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "cloudpickle==3.1.2",
  "jinja2==3.1.6",
  "sqlalchemy==2.0.28",
  "sqlparse==0.4.4",
  "shortuuid==1.0.13",
  "rich==14.2.0",
  "psutil==7.1.0",
  "tenacity==8.3.0",
  "colorama==0.4.6",
  "msgpack==1.1.2",
  "requests==2.32.5",
  "fastapi==0.112.4",
  "httpx==0.28.1",
  "uvicorn==0.34.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
