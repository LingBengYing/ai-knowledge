spring.application.name=evidence-rag-java
spring.threads.virtual.enabled=true
spring.main.banner-mode=off
server.address=${RAG_BIND_ADDRESS:127.0.0.1}
server.port=${RAG_PORT:18084}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.factory.constraints.read.max-document-length=262144
spring.jackson.factory.constraints.read.max-token-count=20000
spring.jackson.factory.constraints.read.max-nesting-depth=20
spring.jackson.factory.constraints.read.max-string-length=20000
spring.jackson.factory.constraints.read.max-name-length=200
rag.environment=${RAG_ENVIRONMENT:development}
rag.workspace-id=${RAG_WORKSPACE_ID:org-main}
rag.auth-mode=${RAG_AUTH_MODE:jwt}
rag.jwt-secret=${RAG_JWT_SECRET:}
rag.jwt-issuer=${RAG_JWT_ISSUER:evidence-rag}
rag.jwt-audience=${RAG_JWT_AUDIENCE:evidence-rag-web}
rag.data-directory=${RAG_DATA_DIRECTORY:./.data}
rag.ingestion.enabled=${RAG_INGESTION_ENABLED:false}
rag.ingestion.parse-timeout-ms=${RAG_INGESTION_PARSE_TIMEOUT_MS:30000}
rag.ingestion.upload-timeout-ms=${RAG_INGESTION_UPLOAD_TIMEOUT_MS:30000}
rag.indexing.enabled=${RAG_INDEXING_ENABLED:false}
rag.indexing.timeout-ms=${RAG_INDEXING_TIMEOUT_MS:60000}
rag.answers.enabled=${RAG_ANSWERS_ENABLED:false}
rag.answers.timeout-ms=${RAG_ANSWERS_TIMEOUT_MS:60000}
rag.answers.max-concurrent=${RAG_ANSWERS_MAX_CONCURRENT:2}
rag.query-attachments.enabled=${RAG_QUERY_ATTACHMENTS_ENABLED:false}
rag.query-attachments.receive-timeout-ms=${RAG_QUERY_ATTACHMENTS_RECEIVE_TIMEOUT_MS:30000}
rag.query-attachments.max-concurrent=${RAG_QUERY_ATTACHMENTS_MAX_CONCURRENT:2}
rag.query-attachments.ocr-deadline-ms=${RAG_QUERY_ATTACHMENTS_OCR_DEADLINE_MS:30000}
rag.query-attachments.ranking.base-url=${RAG_QUERY_RANKING_BASE_URL:}
rag.query-attachments.ranking.model=${RAG_QUERY_RANKING_MODEL:}
rag.query-attachments.ranking.api-key=${RAG_QUERY_RANKING_API_KEY:}
rag.query-attachments.ranking.deadline-ms=${RAG_QUERY_RANKING_DEADLINE_MS:30000}
rag.query-attachments.ranking.max-response-bytes=${RAG_QUERY_RANKING_MAX_RESPONSE_BYTES:262144}
rag.query-attachments.ranking.allow-loopback-http=${RAG_QUERY_RANKING_ALLOW_LOOPBACK_HTTP:false}
rag.document-removal.enabled=${RAG_DOCUMENT_REMOVAL_ENABLED:false}
rag.image-ocr.enabled=${RAG_IMAGE_OCR_ENABLED:false}
rag.image-ocr.executable=${RAG_IMAGE_OCR_EXECUTABLE:}
rag.image-ocr.language=${RAG_IMAGE_OCR_LANGUAGE:eng}
rag.image-ocr.revision=${RAG_IMAGE_OCR_REVISION:}
rag.visual.enabled=${RAG_VISUAL_ENABLED:false}
rag.visual.base-url=${RAG_VISION_BASE_URL:}
rag.visual.model=${RAG_VISION_MODEL:}
rag.visual.api-key=${RAG_VISION_API_KEY:}
rag.visual.deadline-ms=${RAG_VISION_DEADLINE_MS:30000}
rag.visual.max-response-bytes=${RAG_VISION_MAX_RESPONSE_BYTES:262144}
rag.visual.allow-loopback-http=${RAG_VISION_ALLOW_LOOPBACK_HTTP:false}
rag.audio.enabled=${RAG_AUDIO_ENABLED:false}
rag.audio.ffmpeg-executable=${RAG_AUDIO_FFMPEG_EXECUTABLE:}
rag.audio.ffprobe-executable=${RAG_AUDIO_FFPROBE_EXECUTABLE:}
rag.audio.decode-deadline-ms=${RAG_AUDIO_DECODE_DEADLINE_MS:30000}
rag.audio.chunk-seconds=${RAG_AUDIO_CHUNK_SECONDS:15}
rag.audio.compilation-budget-ms=${RAG_AUDIO_COMPILATION_BUDGET_MS:600000}
rag.audio.base-url=${RAG_AUDIO_BASE_URL:}
rag.audio.model=${RAG_AUDIO_MODEL:}
rag.audio.api-key=${RAG_AUDIO_API_KEY:}
rag.audio.deadline-ms=${RAG_AUDIO_DEADLINE_MS:30000}
rag.audio.max-response-bytes=${RAG_AUDIO_MAX_RESPONSE_BYTES:65536}
rag.audio.allow-loopback-http=${RAG_AUDIO_ALLOW_LOOPBACK_HTTP:false}
rag.video.enabled=${RAG_VIDEO_ENABLED:false}
rag.video.ffmpeg-executable=${RAG_VIDEO_FFMPEG_EXECUTABLE:}
rag.video.ffprobe-executable=${RAG_VIDEO_FFPROBE_EXECUTABLE:}
rag.video.decode-deadline-ms=${RAG_VIDEO_DECODE_DEADLINE_MS:30000}
rag.video.frame-interval-seconds=${RAG_VIDEO_FRAME_INTERVAL_SECONDS:10}
rag.video.chunk-seconds=${RAG_VIDEO_CHUNK_SECONDS:15}
rag.video.compilation-budget-ms=${RAG_VIDEO_COMPILATION_BUDGET_MS:600000}
rag.video.ocr.enabled=${RAG_VIDEO_OCR_ENABLED:false}
rag.video.ocr.executable=${RAG_VIDEO_OCR_EXECUTABLE:}
rag.video.ocr.language=${RAG_VIDEO_OCR_LANGUAGE:eng}
rag.video.ocr.revision=${RAG_VIDEO_OCR_REVISION:}
rag.video.ocr.deadline-ms=${RAG_VIDEO_OCR_DEADLINE_MS:30000}
rag.video.asr.base-url=${RAG_VIDEO_ASR_BASE_URL:}
rag.video.asr.model=${RAG_VIDEO_ASR_MODEL:}
rag.video.asr.api-key=${RAG_VIDEO_ASR_API_KEY:}
rag.video.asr.deadline-ms=${RAG_VIDEO_ASR_DEADLINE_MS:30000}
rag.video.asr.max-response-bytes=${RAG_VIDEO_ASR_MAX_RESPONSE_BYTES:65536}
rag.video.asr.allow-loopback-http=${RAG_VIDEO_ASR_ALLOW_LOOPBACK_HTTP:false}
rag.video.vision.base-url=${RAG_VIDEO_VISION_BASE_URL:}
rag.video.vision.model=${RAG_VIDEO_VISION_MODEL:}
rag.video.vision.api-key=${RAG_VIDEO_VISION_API_KEY:}
rag.video.vision.deadline-ms=${RAG_VIDEO_VISION_DEADLINE_MS:30000}
rag.video.vision.max-response-bytes=${RAG_VIDEO_VISION_MAX_RESPONSE_BYTES:262144}
rag.video.vision.allow-loopback-http=${RAG_VIDEO_VISION_ALLOW_LOOPBACK_HTTP:false}
